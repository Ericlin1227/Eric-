<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Prompt</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #f8fafc;
            background-image: 
                radial-gradient(at 0% 0%, rgba(238, 242, 255, 0.6) 0px, transparent 50%),
                radial-gradient(at 50% 0%, rgba(240, 253, 250, 0.4) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(224, 242, 254, 0.5) 0px, transparent 50%);
            background-size: 100% 100%;
            background-attachment: fixed;
            background-repeat: no-repeat;
        }
        /* 自訂專業灰藍色捲軸樣式 */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="min-h-screen text-slate-800 antialiased flex flex-col justify-between">

    <!-- 主容器 -->
    <div class="container mx-auto px-4 py-10 max-w-7xl flex-grow">
        
        <!-- 頂部標題與狀態 -->
        <header class="text-center mb-10">
            <!-- 標題：AI Prompt -->
            <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight text-slate-950 flex items-center justify-center gap-3">
                <span class="bg-gradient-to-r from-indigo-600 to-blue-500 bg-clip-text text-transparent">AI Prompt</span>
            </h1>
            
            <div class="mt-4 flex items-center justify-center gap-3 flex-wrap">
                <!-- 原始 Google Sheet 連結 -->
                <a href="https://docs.google.com/spreadsheets/d/1Ik0jqbZ0kOpaQZMkydM3I_iNHd8u9uda9bkXxctz360/edit?usp=sharing" 
                   target="_blank" 
                   class="inline-flex items-center gap-2 text-xs font-semibold text-slate-600 hover:text-indigo-600 hover:border-indigo-300 bg-white border border-slate-200/80 px-4 py-2 rounded-full shadow-sm transition duration-200">
                    <i class="fa-solid fa-file-excel text-emerald-600 text-sm"></i>
                    <span>開啟 Google Sheet 資料源</span>
                </a>
                
                <!-- 數據連線狀態指示器 -->
                <div id="status-indicator" class="inline-flex items-center gap-2 text-xs font-semibold px-4 py-2 rounded-full bg-white text-slate-500 border border-slate-200/80 shadow-sm">
                    <span class="relative flex h-2 w-2">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-amber-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2 w-2 bg-amber-500"></span>
                    </span>
                    <span id="status-text">同步雲端資料庫中...</span>
                </div>
            </div>
        </header>

        <!-- 搜尋欄 (極簡 SaaS 風格) -->
        <div class="max-w-2xl mx-auto mb-10 relative">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                <i class="fa-solid fa-magnifying-glass text-slate-400"></i>
            </div>
            <input type="text" 
                   id="search-input" 
                   placeholder="搜尋提示詞、分類或關鍵字..." 
                   class="w-full pl-11 pr-4 py-3.5 bg-white border border-slate-200 rounded-full shadow-[0_4px_20px_rgba(0,0,0,0.02)] placeholder-slate-400 text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all text-base">
        </div>

        <!-- 分類過濾按鈕 (Pills) -->
        <div class="flex flex-wrap justify-center gap-2 mb-10 max-w-4xl mx-auto" id="categories-container">
            <!-- 骨架屏載入效果 -->
            <div class="h-9 w-16 bg-slate-200/80 animate-pulse rounded-full"></div>
            <div class="h-9 w-24 bg-slate-200/80 animate-pulse rounded-full"></div>
            <div class="h-9 w-24 bg-slate-200/80 animate-pulse rounded-full"></div>
        </div>

        <!-- 區段標題 -->
        <div class="border-b border-slate-200 pb-4 mb-8 flex items-center justify-between">
            <h2 class="text-xl font-extrabold text-slate-900 flex items-center gap-2.5">
                <span class="flex h-2.5 w-2.5 rounded-full bg-indigo-600"></span>
                <span>AI 協思模組</span>
            </h2>
            <span id="prompt-counter" class="text-xs font-bold text-slate-500 bg-slate-100 border border-slate-200/50 px-3 py-1.5 rounded-full">
                共找到 -- 個模組
            </span>
        </div>

        <!-- 提示詞卡片網格 -->
        <main class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6" id="cards-container">
            <!-- 骨架載入動畫 -->
            <div class="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm animate-pulse flex flex-col justify-between h-[420px]">
                <div>
                    <div class="h-5 w-20 bg-slate-200 rounded-md mb-4"></div>
                    <div class="h-6 w-3/4 bg-slate-200 rounded-md mb-6"></div>
                    <div class="space-y-2">
                        <div class="h-4 bg-slate-200 rounded-md"></div>
                        <div class="h-4 bg-slate-200 rounded-md w-5/6"></div>
                    </div>
                </div>
                <div class="h-10 bg-slate-200 rounded-xl mt-6"></div>
            </div>
            <!-- 重複骨架 -->
            <div class="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm animate-pulse flex flex-col justify-between h-[420px] hidden md:flex">
                <div>
                    <div class="h-5 w-20 bg-slate-200 rounded-md mb-4"></div>
                    <div class="h-6 w-3/4 bg-slate-200 rounded-md mb-6"></div>
                    <div class="space-y-2">
                        <div class="h-4 bg-slate-200 rounded-md"></div>
                        <div class="h-4 bg-slate-200 rounded-md w-5/6"></div>
                    </div>
                </div>
                <div class="h-10 bg-slate-200 rounded-xl mt-6"></div>
            </div>
        </main>
    </div>

    <!-- 頁尾 -->
    <footer class="bg-white border-t border-slate-200 py-6 mt-16 shadow-inner">
        <div class="container mx-auto px-4 text-center text-xs text-slate-500 font-medium">
            <p>AI PROMPT MANAGEMENT SYSTEM • DESIGNED FOR WORKPLACE EFFICIENCY</p>
        </div>
    </footer>

    <!-- 浮動通知容器 (Toast) -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2"></div>

    <script>
        // Google Sheet 網址與 ID 參數
        const SHEET_ID = '1Ik0jqbZ0kOpaQZMkydM3I_iNHd8u9uda9bkXxctz360';
        const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv`;

        // 完美備用資料 (以防斷網或CORS限制)
        const fallbackData = [
            {
                category: "內容創作",
                title: "意義單詞",
                prompt: "將文章的重點部分，尋找一個代表性英文字母，並使這些字母的首字組合成一個有意義的單詞（如「VISION」）。"
            },
            {
                category: "內容創作",
                title: "品牌名稱",
                prompt: "完成 ChatGPT 角色定義後，依據「品牌定義」與「產品介紹」發想5個產品名稱與標題（口號）。\n- 提示詞指令：描述品牌與產品，請列出數字 個產品名稱與行銷標題建議。(*品牌定義*描述、*產品介紹*描述)\n- Prompt: \n我推出一個運動鞋品牌，今年會銷售一款新型跑步..."
            },
            {
                category: "筆記精煉",
                title: "長編文章",
                prompt: "為這一篇長篇文章，進行以下四個步驟，每一個步驟都提供給文章與標示出來\n第1、請為這篇長文件生成一份簡短摘要。\n第2、請基於上一個摘要，不要遺漏任何專有名詞、數字或關鍵人物，重新生成一份摘要。\n第3、現在，請將摘要中每一句話都濃縮成更簡潔的表達，同時保留..."
            },
            {
                category: "筆記精煉",
                title: "書籍精煉",
                prompt: "請對 @[檔名]\n啟動【終極煉金管線】，一次執行四步驟整合：\n第一步：全域架構導航 (Stage 01) 執行 stage-1-navigator，對精煉稿進行深度掃描，產出知識地圖與反直覺預警。\n存檔：01_Map_[主題簡稱].md。\n第二步：價值 DNA 診斷 (Stage 02)"
            },
            {
                category: "筆記精煉",
                title: "提取練習",
                prompt: "我剛讀完了關於 [填入具體段落標題] 的內容。現在請幫我進行深度研磨：\n\n1-底層邏輯拷問：針對這段內容的「運作原理」向我提問，測試我是否理解了「為什麼有效」，而非只是記住步驟。\n\n2-環境轉化：如果這段概念有複雜..."
            },
            {
                category: "內容創作",
                title: "影片清理",
                prompt: "你的角色是一位「逐字稿校對員」，不是編輯。\n任務：\n1-僅刪除口語填充詞、重複說法、明顯贅詞\n2-不得改寫句型、不得改變原意、不得加入新解釋\n規則：\n1-原句順序必須完全一致\n2-若刪除任何詞語，需確保前後輿..."
            },
            {
                category: "內容創作",
                title: "影片清理",
                prompt: "你的角色是一位「內容結構化整理員」，不是編輯、不是評論者。\n\n我會提供一段約 4000 字的影片文字內容，請你在完全保留原作者語意與立場的前提下，\n進行「保留語意的濃縮」，將內容壓縮至 約 2000 字。全文用繁體中文呈現。"
            }
        ];

        let prompts = [];
        let selectedCategory = '全部';
        let searchQuery = '';

        // CSV 解析
        function parseCSV(text) {
            let p = '', c = '', r = [];
            let q = false;
            let row = [''];
            for (let i = 0; i < text.length; i++) {
                c = text[i];
                let next = text[i+1];
                if (c === '"') {
                    if (q && next === '"') { row[row.length - 1] += '"'; i++; }
                    else { q = !q; }
                } else if (c === ',' && !q) {
                    row.push('');
                } else if ((c === '\r' || c === '\n') && !q) {
                    if (c === '\r' && next === '\n') { i++; }
                    r.push(row);
                    row = [''];
                } else {
                    row[row.length - 1] += c;
                }
            }
            if (row.length > 1 || row[0] !== '') {
                r.push(row);
            }
            return r;
        }

        // 載入資料
        async function loadData() {
            const statusIndicator = document.getElementById('status-indicator');
            const statusText = document.getElementById('status-text');

            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 6000);

                const response = await fetch(CSV_URL, { signal: controller.signal });
                clearTimeout(timeoutId);

                if (!response.ok) throw new Error('連線異常');
                
                const csvText = await response.text();
                const parsed = parseCSV(csvText);
                
                if (parsed.length < 2) throw new Error('空資料庫');

                const headers = parsed[0].map(h => h.trim().toLowerCase());
                let categoryIdx = headers.findIndex(h => h.includes('分類') || h.includes('標籤') || h.includes('category') || h.includes('tag'));
                let titleIdx = headers.findIndex(h => h.includes('標題') || h.includes('名稱') || h.includes('title') || h.includes('name'));
                let promptIdx = headers.findIndex(h => h.includes('提示詞') || h.includes('內容') || h.includes('prompt') || h.includes('content'));

                if (categoryIdx === -1) categoryIdx = 0;
                if (titleIdx === -1) titleIdx = 1;
                if (promptIdx === -1) promptIdx = 2;

                const loadedPrompts = [];
                for (let i = 1; i < parsed.length; i++) {
                    const row = parsed[i];
                    if (row.length <= Math.max(categoryIdx, titleIdx, promptIdx)) continue;
                    
                    const category = row[categoryIdx]?.trim() || '未分類';
                    const title = row[titleIdx]?.trim() || '無標題';
                    const prompt = row[promptIdx]?.trim() || '';
                    
                    if (prompt && title) {
                        loadedPrompts.push({ category, title, prompt });
                    }
                }

                if (loadedPrompts.length === 0) throw new Error('無有效提示詞');

                prompts = loadedPrompts;
                
                statusIndicator.className = "inline-flex items-center gap-2 text-xs font-semibold px-4 py-2 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-100 shadow-sm";
                statusText.innerText = "已同步雲端資料";
                showToast("雲端資料同步成功！");

            } catch (error) {
                console.warn('Google Sheet 載入異常，改用高還原離線資料:', error);
                prompts = fallbackData;
                
                statusIndicator.className = "inline-flex items-center gap-2 text-xs font-semibold px-4 py-2 rounded-full bg-slate-100 text-slate-500 border border-slate-200 shadow-sm";
                statusText.innerText = "已啟用備用資料庫";
            }

            renderCategories();
            renderCards();
        }

        // 渲染分類按鈕
        function renderCategories() {
            const container = document.getElementById('categories-container');
            const categories = ['全部', ...new Set(prompts.map(p => p.category))];
            
            container.innerHTML = categories.map(cat => {
                const isActive = cat === selectedCategory;
                const activeClasses = "bg-gradient-to-r from-indigo-600 to-indigo-700 text-white shadow-md shadow-indigo-100 ring-2 ring-indigo-500 ring-offset-2";
                const inactiveClasses = "bg-white text-slate-600 border border-slate-200/80 hover:bg-slate-50 hover:text-slate-900 shadow-sm";
                
                return `
                    <button onclick="setCategory('${cat}')" 
                            class="px-5 py-2 rounded-full text-xs md:text-sm font-semibold transition-all duration-200 focus:outline-none ${isActive ? activeClasses : inactiveClasses}">
                        ${cat}
                    </button>
                `;
            }).join('');
        }

        window.setCategory = function(category) {
            selectedCategory = category;
            renderCategories();
            renderCards();
        }

        // 安全複製方案
        window.copyPrompt = function(text, btnElement) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            textarea.setSelectionRange(0, 99999);
            
            let success = false;
            try {
                success = document.execCommand('copy');
            } catch (err) {
                console.error('複製失敗:', err);
            }
            document.body.removeChild(textarea);
            
            if (success) {
                showToast('已複製提示詞至剪貼簿！');
                
                const originalText = btnElement.innerHTML;
                btnElement.innerHTML = `<i class="fa-solid fa-check mr-2 animate-bounce"></i>已複製成功`;
                btnElement.classList.replace('from-indigo-600', 'from-emerald-600');
                btnElement.classList.replace('to-blue-600', 'to-teal-600');
                
                setTimeout(() => {
                    btnElement.innerHTML = originalText;
                    btnElement.classList.replace('from-emerald-600', 'from-indigo-600');
                    btnElement.classList.replace('to-teal-600', 'to-blue-600');
                }, 2000);
            } else {
                showToast('複製失敗，請手動複製。', 'error');
            }
        }

        // 浮動提示
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `flex items-center gap-3 px-4 py-3.5 rounded-xl shadow-[0_10px_30px_rgba(0,0,0,0.1)] text-slate-800 font-semibold transform translate-y-2 opacity-0 transition-all duration-300 border ${
                type === 'success' ? 'bg-white border-slate-200/80' : 'bg-red-50 border-red-200 text-red-800'
            }`;
            toast.innerHTML = `
                ${type === 'success' 
                    ? '<div class="flex items-center justify-center bg-indigo-600 rounded-full p-1"><svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg></div>'
                    : '<div class="flex items-center justify-center bg-red-600 rounded-full p-1"><svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg></div>'
                }
                <span class="text-xs md:text-sm tracking-wide">${message}</span>
            `;
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);
            
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // 渲染卡片
        function renderCards() {
            const container = document.getElementById('cards-container');
            const counter = document.getElementById('prompt-counter');
            
            const filtered = prompts.filter(p => {
                const matchesCategory = selectedCategory === '全部' || p.category === selectedCategory;
                const matchesSearch = p.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                      p.prompt.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                      p.category.toLowerCase().includes(searchQuery.toLowerCase());
                return matchesCategory && matchesSearch;
            });

            counter.innerText = `共找到 ${filtered.length} 個提示詞`;

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full py-20 text-center">
                        <div class="inline-block bg-slate-100 p-5 rounded-full text-slate-400 mb-4 text-3xl">
                            <i class="fa-solid fa-magnifying-glass"></i>
                        </div>
                        <h3 class="text-lg font-bold text-slate-700">未找到對應的提示詞</h3>
                        <p class="text-sm text-slate-400 mt-2">請嘗試搜尋其他關鍵字或點擊其他分類</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map(p => {
                const escapedPrompt = p.prompt
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#039;");

                const formattedPrompt = escapedPrompt.replace(/\n/g, '<br>');

                return `
                    <div class="group bg-white rounded-2xl border border-slate-200/80 shadow-[0_4px_20px_rgba(0,0,0,0.02)] hover:shadow-[0_10px_30px_rgba(79,70,229,0.08)] hover:border-indigo-200/80 transition-all duration-300 flex flex-col justify-between overflow-hidden relative h-[420px]">
                        <!-- 卡片頂部高級漸層 -->
                        <div class="h-1 w-full bg-gradient-to-r from-indigo-500 to-blue-500 group-hover:scale-x-110 transition-transform duration-300"></div>
                        
                        <!-- 卡片內容區 -->
                        <div class="p-5 flex-grow flex flex-col">
                            <!-- 分類 Badge -->
                            <div class="mb-3.5 flex items-center justify-between">
                                <span class="inline-block bg-indigo-50 text-indigo-600 border border-indigo-100 text-xs font-bold px-2.5 py-1 rounded-md">
                                    ${p.category}
                                </span>
                            </div>
                            
                            <!-- 標題 -->
                            <h3 class="text-base font-bold text-slate-900 group-hover:text-indigo-600 transition-colors duration-200 mb-3 truncate" title="${p.title}">
                                ${p.title}
                            </h3>
                            
                            <!-- 提示詞文字展示盒 -->
                            <div class="bg-slate-50 border border-slate-100 rounded-xl p-4 flex-grow overflow-y-auto text-sm text-slate-600 leading-relaxed custom-scrollbar h-48 select-text">
                                ${formattedPrompt}
                            </div>
                        </div>
                        
                        <!-- 按鈕區 -->
                        <div class="px-5 pb-5 pt-2">
                            <button onclick="copyPrompt(\`${escapedPrompt}\`, this)" 
                                    class="w-full bg-gradient-to-r from-indigo-600 to-blue-600 hover:from-indigo-700 hover:to-blue-700 text-white font-bold py-3 px-4 rounded-xl shadow-sm transition-all duration-200 text-sm flex items-center justify-center gap-2">
                                <i class="fa-regular fa-copy text-sm"></i>
                                <span>複製 Prompt</span>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 搜尋
        document.getElementById('search-input').addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderCards();
        });

        window.onload = function() {
            loadData();
        };
    </script>
</body>
</html>
